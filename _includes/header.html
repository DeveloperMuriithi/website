	<title>{{TITLE}}</title>
	<script>
		(function(){
			var root=document.documentElement,mode='system',themes=['paper','terminal','phosphor','synthwave','midnight'];
			try { var saved=localStorage.getItem('glasster-theme'); if(themes.indexOf(saved)!==-1)mode=saved; } catch (error) {}
			root.setAttribute('data-theme-mode',mode);
			var dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
			var theme=mode==='system'?(dark?'midnight':'paper'):mode;
			if(mode==='system') { if(dark)root.setAttribute('data-theme',theme); }
			else root.setAttribute('data-theme',theme);
		})();
	</script>
	<link rel="stylesheet" href="/public/style.css">
</head>
